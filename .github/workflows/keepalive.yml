name: keepalive
on:
  push:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install instabox-sdk
      - run: python keepalive.py
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE: ${{ secrets.INSTABOX_MACHINE }}
